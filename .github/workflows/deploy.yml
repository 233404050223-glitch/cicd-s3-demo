```yaml
name: Deploy website len S3

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Lay code tu repository
        uses: actions/checkout@v4

      - name: Kiem tra file website
        run: |
          test -f site/index.html
          grep -q "THAY_TEN_BAN" site/index.html && { echo "Chua thay ten sinh vien"; exit 1; } || true
          grep -q "233404050223" site/index.html

      - name: Cau hinh AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy len S3
	run: aws s3 sync site/ s3://cicd-web-ngocnhuy-2026-01 --delete
```